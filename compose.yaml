services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=lockidb'
      - 'POSTGRES_PASSWORD=locki'
      - 'POSTGRES_USER=locki'
    ports:
      - '5435:5432'
    networks:
      - locki-net
  redis:
    image: 'redis:latest'
    ports:
      - '6375:6379'
    networks:
      - locki-net

networks:
  locki-net:
    name: locki-net