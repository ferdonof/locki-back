name: Code Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop]

  push:
    branches: [develop]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Tests unitarios con cobertura JaCoCo
  # ─────────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run unit tests
        run: |
          mvn --batch-mode test \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dgroups="unit" \
            -Djacoco.destFile=target/jacoco-unit.exec

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-unit
          path: target/jacoco-unit.exec
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 2 — Tests de integración con Testcontainers
  # ─────────────────────────────────────────────
  integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run integration tests
        run: |
          mvn --batch-mode verify \
            -DskipUnitTests=true \
            -Dgroups="integration" \
            -Djacoco.destFile=target/jacoco-integration.exec

      - name: Upload integration test coverage
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-integration
          path: target/jacoco-integration.exec
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 3 — Análisis de calidad
  # Corre en paralelo con los tests.
  # Checkstyle, SpotBugs y PMD.
  # ─────────────────────────────────────────────
  code-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Checkstyle
        id: checkstyle
        run: |
          mvn --batch-mode checkstyle:check \
            -Dcheckstyle.failOnViolation=false \
            -Dcheckstyle.outputFile=target/checkstyle-result.xml \
          || echo "checkstyle_failed=true" >> $GITHUB_OUTPUT

      - name: Run SpotBugs
        id: spotbugs
        run: |
          mvn --batch-mode compile spotbugs:check \
            -Dspotbugs.failOnError=false \
            -Dspotbugs.xmlOutput=true \
            -Dspotbugs.xmlOutputDirectory=target \
          || echo "spotbugs_failed=true" >> $GITHUB_OUTPUT

      - name: Run PMD
        id: pmd
        run: |
          mvn --batch-mode pmd:check \
            -Dpmd.failOnViolation=false \
            -Dpmd.outputDirectory=target \
          || echo "pmd_failed=true" >> $GITHUB_OUTPUT

      - name: Comment analysis results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');

            function parseCheckstyle() {
              try {
                const xml = fs.readFileSync('target/checkstyle-result.xml', 'utf8');
                const errors = (xml.match(/<error /g) || []).length;
                return errors > 0
                  ? `❌ Checkstyle — ${errors} violación(es)`
                  : '✅ Checkstyle — sin violaciones';
              } catch { return '⚪ Checkstyle — reporte no disponible'; }
            }

            function parseSpotBugs() {
              try {
                const xml = fs.readFileSync('target/spotbugsXml.xml', 'utf8');
                const bugs = (xml.match(/<BugInstance /g) || []).length;
                return bugs > 0
                  ? `❌ SpotBugs — ${bugs} bug(s) encontrado(s)`
                  : '✅ SpotBugs — sin bugs detectados';
              } catch { return '⚪ SpotBugs — reporte no disponible'; }
            }

            function parsePmd() {
              try {
                const xml = fs.readFileSync('target/pmd.xml', 'utf8');
                const violations = (xml.match(/<violation /g) || []).length;
                return violations > 0
                  ? `❌ PMD — ${violations} violación(es)`
                  : '✅ PMD — sin violaciones';
              } catch { return '⚪ PMD — reporte no disponible'; }
            }

            const body = `## 🔍 Análisis de calidad de código

            | Herramienta | Resultado |
            |---|---|
            | ${parseCheckstyle()} |
            | ${parseSpotBugs()} |
            | ${parsePmd()} |

            > Los reportes completos están disponibles en los artifacts de esta ejecución.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports
          path: |
            target/checkstyle-result.xml
            target/spotbugsXml.xml
            target/pmd.xml
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 4 — Cobertura combinada
  # Espera a que terminen los tests unitarios
  # y de integración, fusiona los reportes JaCoCo
  # y falla si la cobertura combinada es < 80%.
  # ─────────────────────────────────────────────
  coverage-check:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        with:
          name: jacoco-unit
          path: target/

      - name: Download integration test coverage
        uses: actions/download-artifact@v4
        with:
          name: jacoco-integration
          path: target/

      - name: Merge coverage reports and check threshold
        run: |
          # Fusiona los dos archivos .exec en uno solo
          mvn --batch-mode jacoco:merge \
            -Djacoco.fileSets=target/jacoco-unit.exec,target/jacoco-integration.exec \
            -Djacoco.destFile=target/jacoco-merged.exec

          # Genera el reporte XML a partir del merged
          mvn --batch-mode jacoco:report \
            -Djacoco.dataFile=target/jacoco-merged.exec \
            -Djacoco.outputDirectory=target/site/jacoco-merged

          # Verifica el umbral del 80% — falla el build si no se alcanza
          mvn --batch-mode jacoco:check \
            -Djacoco.dataFile=target/jacoco-merged.exec \
            -Djacoco.haltOnFailure=true \
            -Djacoco.rules='[{"element":"BUNDLE","limits":[{"counter":"INSTRUCTION","value":"COVEREDRATIO","minimum":"0.80"}]}]'

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco-merged/
          retention-days: 7

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            try {
              const xml = fs.readFileSync('target/site/jacoco-merged/jacoco.xml', 'utf8');
              const match = xml.match(/type="INSTRUCTION"[^>]*missed="(\d+)"[^>]*covered="(\d+)"/);
              if (match) {
                const missed = parseInt(match[1]);
                const covered = parseInt(match[2]);
                const total = missed + covered;
                const pct = ((covered / total) * 100).toFixed(1);
                const icon = parseFloat(pct) >= 80 ? '✅' : '❌';

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: `## 📊 Cobertura de tests (unitarios + integración)

                  ${icon} **${pct}%** de cobertura de instrucciones (mínimo requerido: 80%)

                  > Reporte completo disponible en los artifacts de esta ejecución.`
                });
              }
            } catch (e) {
              console.log('No se pudo leer el reporte de cobertura:', e.message);
            }