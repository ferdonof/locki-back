management:
  endpoints:
    web:
      exposure:
        include: "*"

spring:
  application:
    name: locki-admin
  datasource:
    url: jdbc:postgresql://localhost:5450/locki-admin
    username: locki
    password: locki
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/liquibase/changelog.xml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

logging:
  level:
    root: WARN
    com.ferdonof: INFO
    org.springframework: INFO
    liquibase: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

